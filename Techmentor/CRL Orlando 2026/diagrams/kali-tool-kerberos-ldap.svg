<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:18px;font-weight:700}
    .lab{font-size:15px;font-weight:700}
    .sm{font-size:13px;fill:#475569}
    .xs{font-size:11.5px;fill:#475569}
    .mono{font-family:Consolas,'Courier New',monospace;font-size:12px}
    .tag{font-size:12px;font-weight:700}
    .pill{font-size:12px;font-weight:700}
  </style>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#2563eb"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">Kerberos and LDAP: a valid login, no admin yet</text><text x="34" y="60" class="sm">Stage 2. The foothold account proves itself and asks the directory questions.</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="34" y="90" width="101" height="26" rx="13.0" fill="#2563eb"/><text x="84.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">ldap-utils</text><rect x="145" y="90" width="108" height="26" rx="13.0" fill="#2563eb"/><text x="199.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">krb5 client</text><rect x="263" y="90" width="122" height="26" rx="13.0" fill="#2563eb"/><text x="324.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">SASL / GSSAPI</text><rect x="395" y="90" width="64" height="26" rx="13.0" fill="#2563eb"/><text x="427.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">klist</text><rect x="34" y="130" width="290" height="500" rx="10" fill="#eff6ff" stroke="#0f172a" stroke-width="1.5" filter="url(#sh)"/><rect x="34" y="130" width="290" height="6" rx="3" fill="#0f172a"/><text x="50" y="164" class="lab" fill="#0f172a">What it is</text><text x="50" y="192" class="sm" font-size="14">• LDAP is the query language the</text><text x="50" y="213" class="sm" font-size="14">directory speaks: users, groups,</text><text x="50" y="234" class="sm" font-size="14">computers.</text><text x="50" y="263" class="sm" font-size="14">• Kerberos is the ticket system</text><text x="50" y="284" class="sm" font-size="14">behind every AD logon.</text><text x="50" y="313" class="sm" font-size="14">• The krb5 client obtains a ticket.</text><text x="50" y="334" class="sm" font-size="14">klist shows which tickets are held.</text><rect x="337" y="130" width="290" height="500" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/><rect x="337" y="130" width="290" height="6" rx="3" fill="#2563eb"/><text x="353" y="164" class="lab" fill="#2563eb">What we use it for</text><text x="353" y="192" class="sm" font-size="14">• Sign in as labuser, the normal low-</text><text x="353" y="213" class="sm" font-size="14">privilege foothold account.</text><text x="353" y="242" class="sm" font-size="14">• Prove the Kerberos ticket works,</text><text x="353" y="263" class="sm" font-size="14">then ask LDAP for computers and</text><text x="353" y="284" class="sm" font-size="14">their DNS names.</text><text x="353" y="313" class="sm" font-size="14">• This is the &quot;I have a login, not</text><text x="353" y="334" class="sm" font-size="14">admin&quot; stage every real intrusion</text><text x="353" y="355" class="sm" font-size="14">passes through.</text><rect x="640" y="130" width="290" height="500" rx="10" fill="#eff6ff" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/><rect x="640" y="130" width="290" height="6" rx="3" fill="#0d9488"/><text x="656" y="164" class="lab" fill="#0d9488">What Defender sees</text><text x="656" y="192" class="sm" font-size="14">• MDI logs ticket requests per user,</text><text x="656" y="213" class="sm" font-size="14">so a foothold account asking many</text><text x="656" y="234" class="sm" font-size="14">questions is visible.</text><text x="656" y="263" class="sm" font-size="14">• Broad LDAP enumeration from a</text><text x="656" y="284" class="sm" font-size="14">workstation triggers reconnaissance</text><text x="656" y="305" class="sm" font-size="14">alerts.</text><text x="656" y="334" class="sm" font-size="14">• Old ticket encryption types (RC4)</text><text x="656" y="355" class="sm" font-size="14">stand out in MDI and in logs.</text><rect x="943" y="130" width="290" height="500" rx="10" fill="#eff6ff" stroke="#b45309" stroke-width="1.5" filter="url(#sh)"/><rect x="943" y="130" width="290" height="6" rx="3" fill="#b45309"/><text x="959" y="164" class="lab" fill="#b45309">How we close it</text><text x="959" y="192" class="sm" font-size="14">• Kerberos AES-only, with RC4</text><text x="959" y="213" class="sm" font-size="14">disabled where the lab allows.</text><text x="959" y="242" class="sm" font-size="14">• LDAP signing and channel binding</text><text x="959" y="263" class="sm" font-size="14">enforced; anonymous LDAP off.</text><text x="959" y="292" class="sm" font-size="14">• Least privilege for domain users. A</text><text x="959" y="313" class="sm" font-size="14">normal user should not read</text><text x="959" y="334" class="sm" font-size="14">everything.</text><text x="34" y="672" class="sm" fill="#475569">Teaching point: almost every AD attack starts with a valid ordinary login. Make that login&#x27;s blast radius small.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>