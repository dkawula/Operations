<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <style>
      .ttl{font-size:26px;font-weight:700;fill:#0f172a}
      .sub{font-size:14px;fill:#475569}
      .box{rx:12;ry:12;stroke-width:2}
      .bt{font-size:16px;font-weight:700}
      .bs{font-size:12.5px}
      .lbl{font-size:12.5px;font-weight:600;fill:#334155}
      .lblg{font-size:12.5px;font-weight:600;fill:#0d9488}
      .mono{font-family:Consolas,monospace;font-size:12.5px}
      .zone{font-size:13px;font-weight:700;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1120" height="680" fill="#f8fafc"/>
  <text x="40" y="46" class="ttl">How <tspan class="mono" font-size="24" fill="#0f172a">az vm run-command</tspan> reaches a VM</text>
  <text x="40" y="70" class="sub">Control-plane execution — no connection to the guest OS, NSG bypassed. Runs as SYSTEM / root via the in-VM agent.</text>

  <!-- CONTROL PLANE ZONE -->
  <rect x="30" y="92" width="1060" height="252" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="48" y="116" class="zone" fill="#1d4ed8">AZURE CONTROL PLANE  (identity + management — HTTPS, no guest network path)</text>

  <!-- Operator -->
  <rect x="48" y="138" width="200" height="92" class="box" fill="#ffffff" stroke="#334155"/>
  <text x="148" y="172" text-anchor="middle" class="bt" fill="#0f172a">Operator</text>
  <text x="148" y="194" text-anchor="middle" class="bs" fill="#475569">You +</text>
  <text x="148" y="212" text-anchor="middle" class="mono" fill="#0f172a">az CLI</text>

  <!-- Entra -->
  <rect x="312" y="138" width="200" height="92" class="box" fill="#ffffff" stroke="#334155"/>
  <text x="412" y="172" text-anchor="middle" class="bt" fill="#0f172a">Entra ID</text>
  <text x="412" y="196" text-anchor="middle" class="bs" fill="#475569">issues access token</text>
  <text x="412" y="214" text-anchor="middle" class="bs" fill="#475569">for your identity</text>

  <!-- ARM -->
  <rect x="576" y="130" width="224" height="108" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="688" y="162" text-anchor="middle" class="bt" fill="#1d4ed8">Azure Resource Mgr</text>
  <text x="688" y="184" text-anchor="middle" class="bs" fill="#475569">RBAC check:</text>
  <text x="688" y="202" text-anchor="middle" class="mono" fill="#b91c1c">runCommand/action</text>
  <text x="688" y="222" text-anchor="middle" class="bs" fill="#475569">(VM Contributor+)</text>

  <!-- Host / Fabric -->
  <rect x="864" y="138" width="200" height="92" class="box" fill="#ffffff" stroke="#334155"/>
  <text x="964" y="168" text-anchor="middle" class="bt" fill="#0f172a">Host /</text>
  <text x="964" y="188" text-anchor="middle" class="bt" fill="#0f172a">Fabric Controller</text>
  <text x="964" y="212" text-anchor="middle" class="bs" fill="#475569">writes goal state</text>

  <!-- control-plane arrows -->
  <line x1="248" y1="184" x2="306" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="277" y="176" text-anchor="middle" class="lbl">1</text>
  <line x1="512" y1="184" x2="570" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="541" y="176" text-anchor="middle" class="lbl">2 HTTPS</text>
  <line x1="800" y1="184" x2="858" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="831" y="176" text-anchor="middle" class="lbl">3</text>

  <!-- VMBus link down to VM zone -->
  <line x1="964" y1="230" x2="964" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="978" y="268" class="lbl">Hyper-V VMBus</text>

  <!-- VM ZONE -->
  <rect x="30" y="360" width="1060" height="286" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="48" y="384" class="zone" fill="#15803d">INSIDE THE VM  (data plane — the agent does the work locally)</text>

  <!-- WireServer -->
  <rect x="820" y="402" width="244" height="110" class="box" fill="#ffffff" stroke="#334155"/>
  <text x="942" y="432" text-anchor="middle" class="bt" fill="#0f172a">WireServer (host)</text>
  <text x="942" y="456" text-anchor="middle" class="mono" fill="#0f172a">168.63.129.16</text>
  <text x="942" y="476" text-anchor="middle" class="bs" fill="#475569">virtual IP of the host node</text>
  <text x="942" y="494" text-anchor="middle" class="bs" fill="#475569">not subject to NSG / UDR</text>

  <!-- Guest agent -->
  <rect x="300" y="402" width="432" height="140" class="box" fill="#ffffff" stroke="#16a34a"/>
  <text x="516" y="432" text-anchor="middle" class="bt" fill="#15803d">Guest Agent</text>
  <text x="516" y="452" text-anchor="middle" class="bs" fill="#475569">WindowsAzureGuestAgent / waagent</text>
  <text x="516" y="478" text-anchor="middle" class="bs" fill="#475569">pulls the RunCommand extension + your script</text>
  <rect x="340" y="492" width="352" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="516" y="516" text-anchor="middle" class="bt" font-size="15" fill="#b45309">runs script as SYSTEM (Win) / root (Linux)</text>

  <!-- poll arrow between agent and wireserver -->
  <line x1="732" y1="452" x2="814" y2="452" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="773" y="444" text-anchor="middle" class="lblg">4 poll</text>
  <text x="773" y="430" text-anchor="middle" class="lblg" font-size="11">every ~6s</text>
  <line x1="814" y1="470" x2="732" y2="470" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="773" y="486" text-anchor="middle" class="mono" font-size="11" fill="#15803d">80 + 32526</text>

  <!-- goal state from host into VM zone (arrow 3 continues) -->
  <line x1="964" y1="340" x2="964" y2="398" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NSG bypassed callout -->
  <rect x="48" y="402" width="212" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="154" y="438" text-anchor="middle" class="bt" fill="#64748b">NSG</text>
  <text x="154" y="468" text-anchor="middle" class="bs" fill="#64748b">RDP / SSH ports</text>
  <text x="154" y="488" text-anchor="middle" class="bs" fill="#64748b">not in the path</text>
  <text x="154" y="516" text-anchor="middle" class="bt" font-size="14" fill="#dc2626">BYPASSED</text>

  <!-- return path -->
  <path d="M300 520 C 200 560, 160 560, 150 560 L 150 560" fill="none"/>
  <line x1="340" y1="542" x2="340" y2="596" stroke="#0d9488" stroke-width="2"/>
  <line x1="340" y1="596" x2="700" y2="596" stroke="#0d9488" stroke-width="2"/>
  <line x1="700" y1="596" x2="700" y2="250" stroke="#0d9488" stroke-width="2" stroke-dasharray="2 0"/>
  <line x1="700" y1="250" x2="700" y2="240" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowRet)"/>
  <text x="470" y="588" text-anchor="middle" class="lblg">6  results return  →  443 to AzureCloud  →  ARM  →  az   (last 4096 bytes)</text>

  <!-- footnote -->
  <text x="40" y="668" class="sub">Power comes from the RBAC role, not credentials. Two witnesses: Azure Activity Log (who called it) + Defender for Endpoint on the guest (what it did).</text>
</svg>
