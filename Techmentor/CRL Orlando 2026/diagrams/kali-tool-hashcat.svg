<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:18px;font-weight:700}
    .lab{font-size:15px;font-weight:700}
    .sm{font-size:13px;fill:#475569}
    .xs{font-size:11.5px;fill:#475569}
    .mono{font-family:Consolas,'Courier New',monospace;font-size:12px}
    .tag{font-size:12px;font-weight:700}
    .pill{font-size:12px;font-weight:700}
  </style>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#b45309"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">Offline cracking: the attack that never touches the network</text><text x="34" y="60" class="sm">Stage 4. Hashes captured earlier are tested against wordlists on Kali&#x27;s own CPU.</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="34" y="90" width="79" height="26" rx="13.0" fill="#b45309"/><text x="73.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">hashcat</text><rect x="123" y="90" width="93" height="26" rx="13.0" fill="#b45309"/><text x="169.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">wordlists</text><rect x="226" y="90" width="64" height="26" rx="13.0" fill="#b45309"/><text x="258.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">rules</text><rect x="34" y="130" width="290" height="500" rx="10" fill="#fffbeb" stroke="#0f172a" stroke-width="1.5" filter="url(#sh)"/><rect x="34" y="130" width="290" height="6" rx="3" fill="#0f172a"/><text x="50" y="164" class="lab" fill="#0f172a">What it is</text><text x="50" y="192" class="sm" font-size="14">• hashcat tests candidate passwords</text><text x="50" y="213" class="sm" font-size="14">against a captured hash, on your</text><text x="50" y="234" class="sm" font-size="14">own hardware.</text><text x="50" y="263" class="sm" font-size="14">• Wordlists are ranked guesses:</text><text x="50" y="284" class="sm" font-size="14">common passwords, then seasonal</text><text x="50" y="305" class="sm" font-size="14">variants.</text><text x="50" y="334" class="sm" font-size="14">• It never talks to the domain, so</text><text x="50" y="355" class="sm" font-size="14">there is no lockout and no network</text><text x="50" y="376" class="sm" font-size="14">log.</text><rect x="337" y="130" width="290" height="500" rx="10" fill="#fffbeb" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/><rect x="337" y="130" width="290" height="6" rx="3" fill="#2563eb"/><text x="353" y="164" class="lab" fill="#2563eb">What we use it for</text><text x="353" y="192" class="sm" font-size="14">• Show why password quality matters,</text><text x="353" y="213" class="sm" font-size="14">using three service accounts of</text><text x="353" y="234" class="sm" font-size="14">graded strength.</text><text x="353" y="263" class="sm" font-size="14">• A top-ten password falls at once. A</text><text x="353" y="284" class="sm" font-size="14">seasonal one needs a wordlist. A</text><text x="353" y="305" class="sm" font-size="14">long passphrase may survive class</text><text x="353" y="326" class="sm" font-size="14">time.</text><text x="353" y="355" class="sm" font-size="14">• The lesson is the graded</text><text x="353" y="376" class="sm" font-size="14">difficulty, not the tool.</text><rect x="640" y="130" width="290" height="500" rx="10" fill="#fffbeb" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/><rect x="640" y="130" width="290" height="6" rx="3" fill="#0d9488"/><text x="656" y="164" class="lab" fill="#0d9488">What Defender sees</text><text x="656" y="192" class="sm" font-size="14">• Nothing live: the cracking happens</text><text x="656" y="213" class="sm" font-size="14">off-network.</text><text x="656" y="242" class="sm" font-size="14">• The signal happened at extraction.</text><text x="656" y="263" class="sm" font-size="14">MDI alerts on the Kerberos ticket</text><text x="656" y="284" class="sm" font-size="14">requests for the service account.</text><text x="656" y="313" class="sm" font-size="14">• Detect at the request, not at the</text><text x="656" y="334" class="sm" font-size="14">crack. That is the teaching point.</text><rect x="943" y="130" width="290" height="500" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" filter="url(#sh)"/><rect x="943" y="130" width="290" height="6" rx="3" fill="#b45309"/><text x="959" y="164" class="lab" fill="#b45309">How we close it</text><text x="959" y="192" class="sm" font-size="14">• gMSA for service accounts:</text><text x="959" y="213" class="sm" font-size="14">120-character passwords that AD</text><text x="959" y="234" class="sm" font-size="14">rotates itself.</text><text x="959" y="263" class="sm" font-size="14">• Long random passwords for any</text><text x="959" y="284" class="sm" font-size="14">account with an SPN, and no reuse.</text><text x="959" y="313" class="sm" font-size="14">• AES-only tickets, so offline</text><text x="959" y="334" class="sm" font-size="14">cracking gets slower and easier to</text><text x="959" y="355" class="sm" font-size="14">alert on.</text><text x="34" y="672" class="sm" fill="#475569">Teaching point: offline attacks leave almost no network trace. Detection and prevention both have to happen earlier.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>