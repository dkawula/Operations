</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#dc2626"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">Kali toolbox: what each tool group does</text><text x="34" y="60" class="sm">Kill chain, left to right. Each stage uses the access the last one earned.</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="40" y="112" width="215" height="40" rx="0" fill="#f1f5f9" stroke="#e2e8f0"/><text x="54" y="138" class="lab" fill="#0f172a" font-size="14">Stage</text><rect x="255" y="112" width="300" height="40" rx="0" fill="#f1f5f9" stroke="#e2e8f0"/><text x="269" y="138" class="lab" fill="#0f172a" font-size="14">Tool group</text><rect x="555" y="112" width="285" height="40" rx="0" fill="#f1f5f9" stroke="#e2e8f0"/><text x="569" y="138" class="lab" fill="#0f172a" font-size="14">Target in our lab</text><rect x="840" y="112" width="380" height="40" rx="0" fill="#f1f5f9" stroke="#e2e8f0"/><text x="854" y="138" class="lab" fill="#0f172a" font-size="14">What Defender sees</text><rect x="40" y="152" width="1180" height="88" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="54" y="202.5" class="sm" fill="#0f172a" font-weight="700" font-size="14">1  Recon</text><text x="269" y="202.5" class="sm" fill="#0f172a" font-size="14">nmap, ping, dig, getent, netcat</text><text x="569" y="202.5" class="sm" fill="#0f172a" font-size="14">DC01 .10 · WIN11 .20 · WIN11B .21</text><text x="854" y="202.5" class="sm" fill="#475569" font-size="14">MDI: DNS and network-mapping recon on DC01</text><rect x="40" y="240" width="1180" height="88" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" /><text x="54" y="290.5" class="sm" fill="#2563eb" font-weight="700" font-size="14">2  Kerberos + LDAP</text><text x="269" y="290.5" class="sm" fill="#0f172a" font-size="14">ldap-utils, krb5 client, SASL/GSSAPI</text><text x="569" y="281.0" class="sm" fill="#0f172a" font-size="14">DC01 as a low-priv labuser</text><text x="569" y="300.0" class="sm" fill="#0f172a" font-size="14">foothold</text><text x="854" y="281.0" class="sm" fill="#475569" font-size="14">MDI: LDAP enumeration; Kerberos ticket events</text><text x="854" y="300.0" class="sm" fill="#475569" font-size="14">per user</text><rect x="40" y="328" width="1180" height="88" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="54" y="378.5" class="sm" fill="#7c3aed" font-weight="700" font-size="14">3  Remote tooling</text><text x="269" y="378.5" class="sm" fill="#0f172a" font-size="14">Impacket suite, NetExec</text><text x="569" y="369.0" class="sm" fill="#0f172a" font-size="14">WIN11 and WIN11B over SMB and</text><text x="569" y="388.0" class="sm" fill="#0f172a" font-size="14">WinRM</text><text x="854" y="369.0" class="sm" fill="#475569" font-size="14">MDE on WIN11: credential-access and remote-</text><text x="854" y="388.0" class="sm" fill="#475569" font-size="14">service alerts</text><rect x="40" y="416" width="1180" height="88" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" /><text x="54" y="466.5" class="sm" fill="#b45309" font-weight="700" font-size="14">4  Offline cracking</text><text x="269" y="466.5" class="sm" fill="#0f172a" font-size="14">hashcat + wordlists</text><text x="569" y="457.0" class="sm" fill="#0f172a" font-size="14">Captured hashes, no network</text><text x="569" y="476.0" class="sm" fill="#0f172a" font-size="14">contact</text><text x="854" y="457.0" class="sm" fill="#475569" font-size="14">Nothing live. Signal happened at extraction</text><text x="854" y="476.0" class="sm" fill="#475569" font-size="14">(Kerberoast)</text><rect x="40" y="504" width="1180" height="88" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="54" y="554.5" class="sm" fill="#dc2626" font-weight="700" font-size="14">5  Command and control</text><text x="269" y="545.0" class="sm" fill="#0f172a" font-size="14">Sliver server on Kali, implant on</text><text x="269" y="564.0" class="sm" fill="#0f172a" font-size="14">victim</text><text x="569" y="545.0" class="sm" fill="#0f172a" font-size="14">Session on WIN11 that the other</text><text x="569" y="564.0" class="sm" fill="#0f172a" font-size="14">stages run through</text><text x="854" y="545.0" class="sm" fill="#475569" font-size="14">MDE: implant process, odd network, behaviour</text><text x="854" y="564.0" class="sm" fill="#475569" font-size="14">alerts</text><text x="40" y="622" class="sm" fill="#475569">Attacker: KALI 192.168.57.5 (base image, nothing auto-installed). Sliver is installed by hand. Tool names only, no command syntax on this slide.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>