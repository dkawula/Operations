<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:18px;font-weight:700}
    .lab{font-size:15px;font-weight:700}
    .sm{font-size:13px;fill:#475569}
    .xs{font-size:11.5px;fill:#475569}
    .mono{font-family:Consolas,'Courier New',monospace;font-size:12px}
    .tag{font-size:12px;font-weight:700}
    .pill{font-size:12px;font-weight:700}
  </style>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#dc2626"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">Sliver C2: the session that the other stages run through</text><text x="34" y="60" class="sm">Stage 5. Command and control: a server on Kali, an agent on the victim.</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="34" y="90" width="174" height="26" rx="13.0" fill="#dc2626"/><text x="121.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">Sliver server (Kali)</text><rect x="218" y="90" width="144" height="26" rx="13.0" fill="#dc2626"/><text x="290.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">implant (victim)</text><rect x="372" y="90" width="86" height="26" rx="13.0" fill="#dc2626"/><text x="415.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">sessions</text><rect x="34" y="130" width="290" height="500" rx="10" fill="#fef2f2" stroke="#0f172a" stroke-width="1.5" filter="url(#sh)"/><rect x="34" y="130" width="290" height="6" rx="3" fill="#0f172a"/><text x="50" y="164" class="lab" fill="#0f172a">What it is</text><text x="50" y="192" class="sm" font-size="14">• Sliver is an open-source command-</text><text x="50" y="213" class="sm" font-size="14">and-control framework used in red-</text><text x="50" y="234" class="sm" font-size="14">team exercises (sliver.sh,</text><text x="50" y="255" class="sm" font-size="14">BishopFox/sliver).</text><text x="50" y="284" class="sm" font-size="14">• The server runs on Kali and waits</text><text x="50" y="305" class="sm" font-size="14">for callbacks.</text><text x="50" y="334" class="sm" font-size="14">• The implant is the agent on the</text><text x="50" y="355" class="sm" font-size="14">victim that checks in to the</text><text x="50" y="376" class="sm" font-size="14">server.</text><rect x="337" y="130" width="290" height="500" rx="10" fill="#fef2f2" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/><rect x="337" y="130" width="290" height="6" rx="3" fill="#2563eb"/><text x="353" y="164" class="lab" fill="#2563eb">What we use it for</text><text x="353" y="192" class="sm" font-size="14">• One foothold on WIN11 gives an</text><text x="353" y="213" class="sm" font-size="14">interactive session, so recon,</text><text x="353" y="234" class="sm" font-size="14">Kerberos and remote tooling run</text><text x="353" y="255" class="sm" font-size="14">from there.</text><text x="353" y="284" class="sm" font-size="14">• Shows the operator view: sessions,</text><text x="353" y="305" class="sm" font-size="14">hosts, what&#x27;s connected.</text><text x="353" y="334" class="sm" font-size="14">• Installed by hand on Kali. The kit</text><text x="353" y="355" class="sm" font-size="14">prints a pointer and does not</text><text x="353" y="376" class="sm" font-size="14">install it.</text><rect x="640" y="130" width="290" height="500" rx="10" fill="#fef2f2" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/><rect x="640" y="130" width="290" height="6" rx="3" fill="#0d9488"/><text x="656" y="164" class="lab" fill="#0d9488">What Defender sees</text><text x="656" y="192" class="sm" font-size="14">• MDE on WIN11 flags the implant</text><text x="656" y="213" class="sm" font-size="14">process, unusual child processes</text><text x="656" y="234" class="sm" font-size="14">and outbound connections.</text><text x="656" y="263" class="sm" font-size="14">• Behaviour alerts correlate with the</text><text x="656" y="284" class="sm" font-size="14">earlier recon and LDAP events into</text><text x="656" y="305" class="sm" font-size="14">one XDR incident.</text><text x="656" y="334" class="sm" font-size="14">• WIN11B (stock AV only, not</text><text x="656" y="355" class="sm" font-size="14">onboarded) would show the same</text><text x="656" y="376" class="sm" font-size="14">activity as a local file, with no</text><text x="656" y="397" class="sm" font-size="14">XDR context.</text><rect x="943" y="130" width="290" height="500" rx="10" fill="#fef2f2" stroke="#b45309" stroke-width="1.5" filter="url(#sh)"/><rect x="943" y="130" width="290" height="6" rx="3" fill="#b45309"/><text x="959" y="164" class="lab" fill="#b45309">How we close it</text><text x="959" y="192" class="sm" font-size="14">• ASR rules: block credential</text><text x="959" y="213" class="sm" font-size="14">stealing from LSASS, block child</text><text x="959" y="234" class="sm" font-size="14">processes from Office, and others.</text><text x="959" y="263" class="sm" font-size="14">• Network Protection on, tamper</text><text x="959" y="284" class="sm" font-size="14">protection on, EDR in block mode.</text><text x="959" y="313" class="sm" font-size="14">• Use the twin: WIN11 vs WIN11B side</text><text x="959" y="334" class="sm" font-size="14">by side shows what XDR adds.</text><text x="34" y="672" class="sm" fill="#475569">Teaching point: C2 is the operator&#x27;s remote control. The defence is EDR that sees the implant and correlates it with everything before it.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>