<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:18px;font-weight:700}
    .lab{font-size:15px;font-weight:700}
    .sm{font-size:13px;fill:#475569}
    .xs{font-size:11.5px;fill:#475569}
    .mono{font-family:Consolas,'Courier New',monospace;font-size:12px}
    .tag{font-size:12px;font-weight:700}
    .pill{font-size:12px;font-weight:700}
  </style>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#7c3aed"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">Impacket and NetExec: remote Windows tooling</text><text x="34" y="60" class="sm">Stage 3. Talk to Windows over SMB, RPC, WinRM and LDAP from Linux.</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="34" y="90" width="130" height="26" rx="13.0" fill="#7c3aed"/><text x="99.0" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">Impacket suite</text><rect x="174" y="90" width="79" height="26" rx="13.0" fill="#7c3aed"/><text x="213.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">NetExec</text><rect x="263" y="90" width="93" height="26" rx="13.0" fill="#7c3aed"/><text x="309.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">smbserver</text><rect x="34" y="130" width="290" height="500" rx="10" fill="#f5f3ff" stroke="#0f172a" stroke-width="1.5" filter="url(#sh)"/><rect x="34" y="130" width="290" height="6" rx="3" fill="#0f172a"/><text x="50" y="164" class="lab" fill="#0f172a">What it is</text><text x="50" y="192" class="sm" font-size="14">• Impacket is a Python library of</text><text x="50" y="213" class="sm" font-size="14">Windows protocol clients: SMB, RPC,</text><text x="50" y="234" class="sm" font-size="14">Kerberos.</text><text x="50" y="263" class="sm" font-size="14">• Its example tools are the usual</text><text x="50" y="284" class="sm" font-size="14">Kali remote-admin helpers.</text><text x="50" y="313" class="sm" font-size="14">• NetExec runs the same kinds of</text><text x="50" y="334" class="sm" font-size="14">checks across many hosts at once,</text><text x="50" y="355" class="sm" font-size="14">over SMB, LDAP, WinRM and RDP.</text><rect x="337" y="130" width="290" height="500" rx="10" fill="#f5f3ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/><rect x="337" y="130" width="290" height="6" rx="3" fill="#2563eb"/><text x="353" y="164" class="lab" fill="#2563eb">What we use it for</text><text x="353" y="192" class="sm" font-size="14">• Check which hosts accept the lab</text><text x="353" y="213" class="sm" font-size="14">credentials (WIN11, WIN11B, DC01).</text><text x="353" y="242" class="sm" font-size="14">• From a host where the attacker</text><text x="353" y="263" class="sm" font-size="14">holds admin rights, read the local</text><text x="353" y="284" class="sm" font-size="14">account database.</text><text x="353" y="313" class="sm" font-size="14">• smbserver hosts a short-lived file</text><text x="353" y="334" class="sm" font-size="14">share on Kali, used for moving a</text><text x="353" y="355" class="sm" font-size="14">file between hosts.</text><rect x="640" y="130" width="290" height="500" rx="10" fill="#f5f3ff" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/><rect x="640" y="130" width="290" height="6" rx="3" fill="#0d9488"/><text x="656" y="164" class="lab" fill="#0d9488">What Defender sees</text><text x="656" y="192" class="sm" font-size="14">• MDE on WIN11 flags credential-</text><text x="656" y="213" class="sm" font-size="14">access behaviour and remote service</text><text x="656" y="234" class="sm" font-size="14">creation.</text><text x="656" y="263" class="sm" font-size="14">• MDI on DC01 flags directory</text><text x="656" y="284" class="sm" font-size="14">replication requests from a non-DC</text><text x="656" y="305" class="sm" font-size="14">account.</text><text x="656" y="334" class="sm" font-size="14">• The SMB sessions show up in the</text><text x="656" y="355" class="sm" font-size="14">device timeline and in the XDR</text><text x="656" y="376" class="sm" font-size="14">incident.</text><rect x="943" y="130" width="290" height="500" rx="10" fill="#f5f3ff" stroke="#b45309" stroke-width="1.5" filter="url(#sh)"/><rect x="943" y="130" width="290" height="6" rx="3" fill="#b45309"/><text x="959" y="164" class="lab" fill="#b45309">How we close it</text><text x="959" y="192" class="sm" font-size="14">• LSA protection (RunAsPPL) and</text><text x="959" y="213" class="sm" font-size="14">Credential Guard, so secrets are</text><text x="959" y="234" class="sm" font-size="14">harder to read.</text><text x="959" y="263" class="sm" font-size="14">• SMB signing on; SMBv1 off; LAPS for</text><text x="959" y="284" class="sm" font-size="14">unique local admin passwords.</text><text x="959" y="313" class="sm" font-size="14">• Tiered admin model: domain admins</text><text x="959" y="334" class="sm" font-size="14">never log on to workstations.</text><text x="34" y="672" class="sm" fill="#475569">Teaching point: the protocols are legitimate admin tools. Defence is about who may use them and where secrets live.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>