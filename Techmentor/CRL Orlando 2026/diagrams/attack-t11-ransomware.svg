</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#dc2626"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">T-11  ·  Ransomware behaviour (benign)</text><text x="34" y="60" class="sm">ATT&amp;CK T1486  ·  Impact  ·  target: WIN11</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="34" y="86" width="720" height="384" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/><rect x="50" y="102" width="268" height="24" rx="12.0" fill="#dc2626"/><text x="184.0" y="118.0" class="pill" text-anchor="middle" fill="#ffffff">WHAT HAPPENS  —  attacker on KALI</text><rect x="50" y="138" width="150" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" /><text x="125" y="164" class="lab" text-anchor="middle" fill="#dc2626">KALI</text><text x="125" y="182" class="xs" text-anchor="middle">attacker</text><line x1="210" y1="165" x2="568" y2="165" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/><rect x="578" y="138" width="160" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><text x="658" y="164" class="lab" text-anchor="middle" fill="#2563eb">WIN11</text><text x="658" y="182" class="xs" text-anchor="middle">target</text><circle cx="70" cy="226" r="15" fill="#dc2626"/><text x="70" y="231" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text><text x="100" y="231" class="sm" font-size="14.5">Run the benign Atomic ‘encryptor’ behaviour on WIN11</text><line x1="70" y1="242" x2="70" y2="274" stroke="#94a3b8" stroke-width="2"/><circle cx="70" cy="290" r="15" fill="#dc2626"/><text x="70" y="295" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text><text x="100" y="295" class="sm" font-size="14.5">Delete Volume Shadow Copies (vssadmin) to block recovery</text><line x1="70" y1="306" x2="70" y2="338" stroke="#94a3b8" stroke-width="2"/><circle cx="70" cy="354" r="15" fill="#dc2626"/><text x="70" y="359" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text><text x="100" y="359" class="sm" font-size="14.5">Mass-rewrite files in protected document folders</text><rect x="770" y="86" width="476" height="120" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" /><rect x="770" y="86" width="6" height="120" rx="3" fill="#b45309"/><text x="788" y="112" class="h2" fill="#b45309" font-size="15">⚠  Weakness that enables it</text><text x="788" y="134" class="sm">A user can delete shadow copies and write freely to</text><text x="788" y="152" class="sm">document folders.</text><rect x="770" y="222" width="476" height="248" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" /><rect x="770" y="222" width="6" height="248" rx="3" fill="#0d9488"/><text x="788" y="248" class="h2" fill="#0d9488" font-size="15">🛡  What Defender sees</text><rect x="788" y="262" width="422" height="24" rx="12.0" fill="#0d9488"/><text x="999.0" y="278.0" class="pill" text-anchor="middle" fill="#ffffff">Defender for Endpoint (MDE) + Controlled Folder Access</text><text x="788" y="306" class="xs" font-weight="700">Alert:</text><text x="830" y="306" class="sm" font-size="13.5">“Ransomware behaviour detected” + CFA block</text><text x="788" y="330" class="xs" font-weight="700">Hunt (KQL):</text><rect x="788" y="334" width="440" height="0.1" rx="12" fill="#ffffff" /><rect x="788" y="335" width="440" height="48" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" /><text x="798" y="353" class="mono" font-size="11.5">DeviceProcessEvents | where FileName=~&quot;vssadmin.exe&quot; and</text><text x="798" y="369" class="mono" font-size="11.5">ProcessCommandLine has &quot;delete shadows&quot;</text><rect x="34" y="486" width="1212" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="50" y="512" class="h2" fill="#b45309" font-size="15">🔒  How we close it</text><text x="50" y="534" class="sm">Controlled Folder Access + ASR ransomware rule (Defender Baseline GPO, 2→9) blocks the writes.</text><rect x="34" y="594" width="1212" height="96" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><rect x="34" y="594" width="6" height="96" rx="3" fill="#2563eb"/><text x="50" y="620" class="h2" fill="#2563eb" font-size="15">🔀  Defended twin — WIN11 (onboarded)  vs  WIN11B (stock AV)</text><text x="50" y="644" class="sm">WIN11 blocks + alerts; WIN11B may run the behaviour with only local-AV noise.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>