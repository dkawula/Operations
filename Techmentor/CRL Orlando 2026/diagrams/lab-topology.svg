ASR / CFA / baseline GPO</text><text x="854" y="298" class="sm" text-anchor="end" font-size="16">🛡</text><rect x="900" y="272" width="250" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#sh)"/><rect x="900" y="272" width="6" height="120" rx="3" fill="#334155"/><text x="918" y="299" class="lab" fill="#0f172a">WIN11B · .21</text><text x="918" y="319" class="xs">Victim B — STOCK AV only</text><text x="918" y="335" class="xs">the &#x27;defended twin&#x27;</text><text x="918" y="351" class="xs">nothing reaches XDR</text><text x="1134" y="298" class="sm" text-anchor="end" font-size="16">🖥</text><rect x="340" y="422" width="250" height="100" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#sh)"/><rect x="340" y="422" width="6" height="100" rx="3" fill="#334155"/><text x="358" y="449" class="lab" fill="#0f172a">SRV01 · .30  (optional)</text><text x="358" y="469" class="xs">Member / file server</text><text x="358" y="485" class="xs">domain-joined target</text><text x="574" y="448" class="sm" text-anchor="end" font-size="16">🗄</text><rect x="620" y="422" width="530" height="100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2" filter="url(#sh)"/><rect x="620" y="422" width="6" height="100" rx="3" fill="#b45309"/><text x="638" y="449" class="lab" fill="#0f172a">Hardened Systems OU  +  GPOs</text><text x="638" y="469" class="xs">Simple hardening GPO (WDigest off, RunAsPPL, SMB signing, LLMNR off)</text><text x="638" y="485" class="xs">Defender Baseline GPO (ASR + CFA + network protection + recommended AV)</text><text x="1134" y="448" class="sm" text-anchor="end" font-size="16">🔒</text><line x1="310" y1="332" x2="335" y2="332" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)"/><line x1="592" y1="332" x2="616" y2="332" stroke="#dc2626" stroke-width="3" marker-end="url(#arR)"/><text x="185" y="266" class="xs" fill="#dc2626" font-weight="700">attacks → identity (DC01) + endpoint (WIN11)</text><rect x="60" y="422