<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .h1{font-size:30px;font-weight:800}
    .h2{font-size:18px;font-weight:700}
    .lab{font-size:15px;font-weight:700}
    .sm{font-size:13px;fill:#475569}
    .xs{font-size:11.5px;fill:#475569}
    .mono{font-family:Consolas,'Courier New',monospace;font-size:12px}
    .tag{font-size:12px;font-weight:700}
    .pill{font-size:12px;font-weight:700}
  </style>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1280" height="70" rx="0" fill="#f8fafc" /><rect x="0" y="0" width="10" height="70" fill="#0f172a"/><line x1="0" y1="70" x2="1280" y2="70" stroke="#e2e8f0" stroke-width="2"/><text x="34" y="38" class="h1">Recon: finding the targets</text><text x="34" y="60" class="sm">Stage 1. Which hosts are up, which ports answer, what names resolve.</text><text x="1246" y="38" class="sm" text-anchor="end" fill="#94a3b8">DefXDRLabKit · lab.local</text><text x="1246" y="58" class="xs" text-anchor="end" fill="#94a3b8">Red/Blue Microsoft Defender XDR lab</text><rect x="34" y="90" width="57" height="26" rx="13.0" fill="#0f172a"/><text x="62.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">nmap</text><rect x="101" y="90" width="57" height="26" rx="13.0" fill="#0f172a"/><text x="129.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">ping</text><rect x="168" y="90" width="49" height="26" rx="13.0" fill="#0f172a"/><text x="192.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">dig</text><rect x="227" y="90" width="71" height="26" rx="13.0" fill="#0f172a"/><text x="262.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">getent</text><rect x="308" y="90" width="71" height="26" rx="13.0" fill="#0f172a"/><text x="343.5" y="107.0" class="pill" text-anchor="middle" fill="#ffffff">netcat</text><rect x="34" y="130" width="290" height="500" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" filter="url(#sh)"/><rect x="34" y="130" width="290" height="6" rx="3" fill="#0f172a"/><text x="50" y="164" class="lab" fill="#0f172a">What it is</text><text x="50" y="192" class="sm" font-size="14">• Scanners and lookups. Ping checks</text><text x="50" y="213" class="sm" font-size="14">that a host is reachable.</text><text x="50" y="242" class="sm" font-size="14">• nmap probes which ports answer and</text><text x="50" y="263" class="sm" font-size="14">can name the service behind them.</text><text x="50" y="292" class="sm" font-size="14">• dig and getent ask DNS for names.</text><text x="50" y="313" class="sm" font-size="14">netcat tests a single port.</text><rect x="337" y="130" width="290" height="500" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/><rect x="337" y="130" width="290" height="6" rx="3" fill="#2563eb"/><text x="353" y="164" class="lab" fill="#2563eb">What we use it for</text><text x="353" y="192" class="sm" font-size="14">• Confirm DC01 (.10) is the domain</text><text x="353" y="213" class="sm" font-size="14">controller, and find WIN11 (.20)</text><text x="353" y="234" class="sm" font-size="14">and WIN11B (.21).</text><text x="353" y="263" class="sm" font-size="14">• Check the ports that matter: DNS,</text><text x="353" y="284" class="sm" font-size="14">Kerberos, LDAP, SMB, RDP, WinRM.</text><text x="353" y="313" class="sm" font-size="14">• This is how the attacker learns the</text><text x="353" y="334" class="sm" font-size="14">lab. Nothing is exploited yet.</text><rect x="640" y="130" width="290" height="500" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/><rect x="640" y="130" width="290" height="6" rx="3" fill="#0d9488"/><text x="656" y="164" class="lab" fill="#0d9488">What Defender sees</text><text x="656" y="192" class="sm" font-size="14">• MDI on DC01 raises network-mapping</text><text x="656" y="213" class="sm" font-size="14">reconnaissance alerts (DNS and LDAP</text><text x="656" y="234" class="sm" font-size="14">sweeps).</text><text x="656" y="263" class="sm" font-size="14">• Port scans from a non-admin host</text><text x="656" y="284" class="sm" font-size="14">look noisy to the network sensor.</text><text x="656" y="313" class="sm" font-size="14">• WIN11 (onboarded) records inbound</text><text x="656" y="334" class="sm" font-size="14">probes; WIN11B (stock AV only) does</text><text x="656" y="355" class="sm" font-size="14">not.</text><rect x="943" y="130" width="290" height="500" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="1.5" filter="url(#sh)"/><rect x="943" y="130" width="290" height="6" rx="3" fill="#b45309"/><text x="959" y="164" class="lab" fill="#b45309">How we close it</text><text x="959" y="192" class="sm" font-size="14">• Scope exposure: NSG allows only the</text><text x="959" y="213" class="sm" font-size="14">lab and the management IP.</text><text x="959" y="242" class="sm" font-size="14">• Turn off legacy listeners (SMBv1,</text><text x="959" y="263" class="sm" font-size="14">LLMNR) so there is less to find.</text><text x="959" y="292" class="sm" font-size="14">• Tune MDI so recon alerts reach the</text><text x="959" y="313" class="sm" font-size="14">SOC queue with context.</text><text x="34" y="672" class="sm" fill="#475569">Teaching point: recon is cheap and loud. The defence is making the answers boring and the noise actionable.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>